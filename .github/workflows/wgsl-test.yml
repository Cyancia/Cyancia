name: WGSL Test

on:
  push:
  pull_request:

jobs:
  wgsl-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install Vulkan software driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers

      - name: Install wgsl-test
        run: npm install -g wgsl-test

      - name: Run WGSL tests
        run: wgsl-test run --projectDir crates/cyancia_color
