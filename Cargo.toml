[workspace]
members = [
    "crates/cyancia_abr",
    "crates/cyancia_abr_derive",
    "crates/cyancia_actions",
    "crates/cyancia_anti_aliasing",
    "crates/cyancia_app",
    "crates/cyancia_assets",
    "crates/cyancia_brush",
    "crates/cyancia_bucket_tool",
    "crates/cyancia_canvas",
    "crates/cyancia_color",
    "crates/cyancia_cyan",
    "crates/cyancia_color_selector",
    "crates/cyancia_dock",
    "crates/cyancia_image",
    "crates/cyancia_input",
    "crates/cyancia_math",
    "crates/cyancia_render",
    "crates/cyancia_runtime",
    "crates/cyancia_runtime_derive",
    "crates/cyancia_selection_tool",
    "crates/cyancia_transform_tool",
    "crates/cyancia_shader_graph",
    "crates/cyancia_shader_graph_derive",
    "crates/cyancia_tools",
    "crates/cyancia_undo",
    "crates/cyancia_utils",
    "crates/cyancia_utils_derive",
    "crates/cyancia_widgets",
]
resolver = "3"
default-members = ["crates/cyancia_app"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.package]
publish = false
edition = "2024"
rust-version = "1.96"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
cyancia_abr = { version = "0.1.0", path = "crates/cyancia_abr" }
cyancia_abr_derive = { version = "0.1.0", path = "crates/cyancia_abr_derive" }
cyancia_actions = { version = "0.1.0", path = "crates/cyancia_actions" }
cyancia_anti_aliasing = { version = "0.1.0", path = "crates/cyancia_anti_aliasing" }
cyancia_assets = { version = "0.1.0", path = "crates/cyancia_assets" }
cyancia_brush = { version = "0.1.0", path = "crates/cyancia_brush" }
cyancia_bucket_tool = { version = "0.1.0", path = "crates/cyancia_bucket_tool" }
cyancia_canvas = { version = "0.1.0", path = "crates/cyancia_canvas" }
cyancia_color = { version = "0.1.0", path = "crates/cyancia_color" }
cyancia_cyan = { version = "0.1.0", path = "crates/cyancia_cyan" }
cyancia_color_selector = { version = "0.1.0", path = "crates/cyancia_color_selector" }
cyancia_dock = { version = "0.1.0", path = "crates/cyancia_dock" }
cyancia_image = { version = "0.1.0", path = "crates/cyancia_image" }
cyancia_input = { version = "0.1.0", path = "crates/cyancia_input" }
cyancia_math = { version = "0.1.0", path = "crates/cyancia_math" }
cyancia_render = { version = "0.1.0", path = "crates/cyancia_render" }
cyancia_runtime = { version = "0.1.0", path = "crates/cyancia_runtime" }
cyancia_runtime_derive = { version = "0.1.0", path = "crates/cyancia_runtime_derive" }
cyancia_shader_graph = { version = "0.1.0", path = "crates/cyancia_shader_graph" }
cyancia_shader_graph_derive = { version = "0.1.0", path = "crates/cyancia_shader_graph_derive" }
cyancia_selection_tool = { version = "0.1.0", path = "crates/cyancia_selection_tool" }
cyancia_transform_tool = { version = "0.1.0", path = "crates/cyancia_transform_tool" }
cyancia_tools = { version = "0.1.0", path = "crates/cyancia_tools" }
cyancia_undo = { version = "0.1.0", path = "crates/cyancia_undo" }
cyancia_utils = { version = "0.1.0", path = "crates/cyancia_utils" }
cyancia_utils_derive = { version = "0.1.0", path = "crates/cyancia_utils_derive" }
cyancia_widgets = { version = "0.1.0", path = "crates/cyancia_widgets" }

anyhow = "1"
arc-swap = "1"
atomicow = "1"
bevy_color = "0.18"
bevy_math = { version = "0.18", git = "https://github.com/443eb9/bevy.git", branch = "release-0.18.1", features = [
    "serialize",
    "std",
    "curve",
    "encase",
] }
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
downcast-rs = "2"
dyn-clone = "1"
encase = "0.12"
env_logger = "0.11"
flate2 = "1"
fs_extra = "1"
futures = "0.3"
glam = { version = "0.30", features = ["encase", "serde", "bytemuck"] }
half = "2"
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "crisp",
    "web-colors",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
    "debug",
    "canvas",
    "selector",
    "smol",
] }
iced_aw = { version = "0.13", features = ["context_menu"] }
iced_core = "0.14"
iced_futures = { version = "0.14", features = ["smol"] }
iced_graphics = { version = "0.14", features = ["geometry"] }
iced_runtime = "0.14"
iced_wgpu = { version = "0.14", features = ["geometry"] }
iced_widget = { version = "0.14", features = ["wgpu", "canvas"] }
iced_winit = "0.14"
image = "0.25"
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
lyon = "1"
md5 = "0.8"
moxcms = "0.8"
num-traits = "0.2"
num_enum = "0.7"
palette = "0.7"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
parse-display = "0.11"
path-clean = "1"
proc-macro2 = "1"
proc-macro-crate = "3.5"
quote = "1"
raw-window-handle = { version = "0.6", features = ["std"] }
rayon = "1"
rfd = "0.17"
rmp = "0.8"
rmp-serde = "1"
ringbuffer = "0.16"
rusqlite = { version = "0.40", features = ["bundled-full"] }
rustc-hash = "1"
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
smallvec = "1"
smol = "2"
syn = "2"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
variadics_please = "2"
wesl = { version = "0.4", features = ["package", "naga-ext"] }
wgpu = "27"
windows = "0.62"
winit = "0.30"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = "8"

[patch.crates-io]
naga = { git = "https://github.com/gfx-rs/wgpu", rev = "7a2afeb014cb30a976059717c4ae7c85f01d858e", package = "naga" }
iced = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
iced_beacon = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
iced_core = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
iced_debug = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
iced_devtools = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
iced_futures = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
iced_graphics = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
iced_program = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
iced_renderer = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
iced_runtime = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
iced_selector = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
iced_wgpu = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
iced_widget = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
iced_winit = { git = "https://github.com/443eb9/iced.git", rev = "3d180b29bcdef61209d62bfa99e5b48e56549a44" }
